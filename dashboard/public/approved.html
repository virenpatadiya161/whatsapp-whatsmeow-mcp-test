<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Approved Media</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>

<body>
    <h2>Approved Media (last 100)</h2>
    <p><a href="/index.html">← Back to Pending</a></p>
    <table id="tbl">
        <thead>
            <tr>
                <th>File Name</th>
                <th>Mobile</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script>
        async function load() {
            const res = await fetch('/api/approved');
            const rows = await res.json();
            const tbody = document.querySelector('#tbl tbody');
            tbody.innerHTML = '';
            rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td>${row.filename}</td><td>${row.phone_number}</td>`;
                tbody.appendChild(tr);
            });
        }
        load();
    </script>
</body>

</html>
